AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless prediction infrastructure for BTCUSDT direction forecasting

Parameters:
  DataBucketName:
    Type: String
    Default: dtsc3601-cryptobros-project-879022683465-us-east-2-an
  SagemakerEndpointName:
    Type: String
    Default: ''
  ProjectName:
    Type: String
    Default: dtsc3601-crypto

  TrainingImage:
    Type: String
    Default: ''
    Description: Immutable ECR training image URI with digest. Empty omits retraining resources.
    AllowedPattern: '^$|^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'

  InferenceImage:
    Type: String
    Default: ''
    Description: Immutable ECR inference image URI with digest. Enables private Lambda inference.
    AllowedPattern: '^$|^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'

Conditions:
  InferenceConfigured: !Not [!Equals [!Ref InferenceImage, '']]
  TrainingConfigured: !Not [!Equals [!Ref TrainingImage, '']]

Resources:
  PredictionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-predictions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: prediction_id
          AttributeType: S
      KeySchema:
        - AttributeName: prediction_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  InferenceFunction:
    Type: AWS::Serverless::Function
    Condition: InferenceConfigured
    Properties:
      FunctionName: !Sub '${ProjectName}-inference'
      PackageType: Image
      ImageUri: !Ref InferenceImage
      MemorySize: 1024
      Timeout: 30
      Architectures: [x86_64]

  PredictionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-prediction'
      CodeUri: ../src/prediction/
      Handler: app.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 90
      MemorySize: 256
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucketName
          PREDICTIONS_TABLE: !Ref PredictionsTable
          INFERENCE_FUNCTION: !If [InferenceConfigured, !Ref InferenceFunction, '']
          SAGEMAKER_ENDPOINT: !Ref SagemakerEndpointName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PredictionsTable
        - S3CrudPolicy:
            BucketName: !Ref DataBucketName
        - Statement:
            - Sid: InvokePrivateInference
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-inference'
            - Sid: InvokeSagemakerEndpoint
              Effect: Allow
              Action:
                - sagemaker:InvokeEndpoint
              Resource: '*'

  HourlyPredictionSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-hourly-prediction'
      Description: Requests a BTCUSDT prediction once per hour
      ScheduleExpression: cron(0 * * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt PredictionFunction.Arn
          Id: PredictionTarget

  PredictionSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PredictionFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HourlyPredictionSchedule.Arn

  EvaluationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-evaluation'
      CodeUri: ../src/evaluation/
      Handler: app.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PREDICTIONS_TABLE: !Ref PredictionsTable
          FLAT_THRESHOLD: '0.002'
          HORIZON_MINUTES: '60'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PredictionsTable

  HourlyEvaluationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-hourly-evaluation'
      Description: Evaluates completed BTCUSDT predictions
      ScheduleExpression: cron(15 * * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt EvaluationFunction.Arn
          Id: EvaluationTarget

  EvaluationSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EvaluationFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HourlyEvaluationSchedule.Arn

  RetrainingTable:
    Type: AWS::DynamoDB::Table
    Condition: TrainingConfigured
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: id, AttributeType: S}
      KeySchema:
        - {AttributeName: id, KeyType: HASH}

  RetrainingFunction:
    Type: AWS::Serverless::Function
    Condition: TrainingConfigured
    Properties:
      CodeUri: ../src/retraining/
      Handler: app.handler
      Runtime: python3.12
      Timeout: 300
      Environment:
        Variables:
          RETRAINING_TABLE: !Ref RetrainingTable
          PREDICTIONS_TABLE: !Ref PredictionsTable
          DATA_BUCKET: !Ref DataBucketName
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref PredictionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref RetrainingTable}
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucketName}/retraining/*/metrics.json'

  TrainingRole:
    Type: AWS::IAM::Role
    Condition: TrainingConfigured
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: sagemaker.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CandidateTraining
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucketName}/retraining/*'
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken, logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'

  RetrainingWorkflow:
    Type: AWS::Serverless::StateMachine
    Condition: TrainingConfigured
    Properties:
      Type: STANDARD
      DefinitionUri: retraining.asl.json
      DefinitionSubstitutions:
        FunctionArn: !GetAtt RetrainingFunction.Arn
        TrainingRoleArn: !GetAtt TrainingRole.Arn
        TrainingImage: !Ref TrainingImage
        Bucket: !Ref DataBucketName
      Events:
        CheckAccuracy:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Enabled: false
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref RetrainingFunction}
        - Statement:
            - Effect: Allow
              Action: [sagemaker:CreateTrainingJob, sagemaker:DescribeTrainingJob, sagemaker:StopTrainingJob, sagemaker:AddTags]
              Resource: !Sub 'arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:training-job/btc-*'
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt TrainingRole.Arn
              Condition:
                StringEquals: {iam:PassedToService: sagemaker.amazonaws.com}
            - Effect: Allow
              Action: [events:PutRule, events:DescribeRule, events:PutTargets]
              Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForSageMakerTrainingJobsRule'

Outputs:
  PredictionFunctionName:
    Description: Name of the hourly prediction Lambda
    Value: !Ref PredictionFunction
  PredictionsTableName:
    Description: DynamoDB table containing prediction records
    Value: !Ref PredictionsTable
